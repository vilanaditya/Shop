<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aditya Shop – Mau, UP</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#222;--mu:#666;--ac:#c2410c;--bd:#e5ded3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140f;--card:#221e17;--tx:#f3eee6;--mu:#a89f90;--ac:#fb923c;--bd:#3a3326}}
:root[data-theme="dark"]{--bg:#17140f;--card:#221e17;--tx:#f3eee6;--mu:#a89f90;--ac:#fb923c;--bd:#3a3326}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--ac);color:#fff;padding:20px 16px;text-align:center}
header h1{margin:0;font-size:1.8rem}header p{margin:4px 0 0;opacity:.95}
.wrap{max-width:1000px;margin:auto;padding:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);width:100%}
.bar input{flex:1;min-width:160px}.bar select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.img{height:150px;display:flex;align-items:center;justify-content:center;font-size:3.5rem;background:var(--bd);overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover}
.info{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.info small{color:var(--mu)}.price{font-weight:700;font-size:1.1rem;color:var(--ac)}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--ac);color:#fff;font-weight:600}
button.alt{background:var(--bd);color:var(--tx)}
.info button{margin-top:auto}
#cartBtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 14px #0004;border-radius:30px;padding:14px 20px}
#panel{position:fixed;inset:0;background:#0008;display:none;justify-content:flex-end;z-index:5}
#panel.open{display:flex}
.side{background:var(--bg);width:min(420px,100%);height:100%;overflow:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.qty button{padding:2px 10px}
.side label{display:block;margin:10px 0 4px;font-size:.9rem;color:var(--mu)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1}
footer{text-align:center;color:var(--mu);padding:24px 16px 80px;font-size:.9rem}
.empty{color:var(--mu);text-align:center;padding:30px}
</style>
</head>
<body>
<header><h1>🛍️ Aditya Shop</h1><p id="tag"></p></header>
<div class="wrap">
  <div class="bar">
    <input id="q" placeholder="Search products…" oninput="render()">
    <select id="cat" onchange="render()"></select>
  </div>
  <div class="grid" id="grid"></div>
</div>
<footer>📍 Mau, UP · 📞 <a id="tel"></a> · ✉️ <a id="mail"></a></footer>
<button id="cartBtn" onclick="openCart(true)">🛒 Cart (<span id="cnt">0</span>)</button>

<div id="panel" onclick="if(event.target===this)openCart(false)">
  <div class="side">
    <div class="row"><h2 style="margin:0">Your Cart</h2><button class="alt" onclick="openCart(false)">✕</button></div>
    <div id="items"></div>
    <div class="row"><b>Total</b><b id="tot">₹0</b></div>
    <label>Your name</label><input id="nm">
    <label>Phone number</label><input id="ph" type="tel">
    <label>Delivery address</label><textarea id="ad" rows="3"></textarea>
    <div class="actions">
      <button onclick="send('wa')">Order on WhatsApp</button>
      <button class="alt" onclick="send('mail')">Order by Email</button>
    </div>
    <p style="color:var(--mu);font-size:.85rem">Pay cash on delivery / UPI directly to the shop. No online payment on this site.</p>
  </div>
</div>

<script>
/* ====== EDIT SHOP DETAILS & PRODUCTS HERE ====== */
const SHOP={name:"Aditya Shop",tagline:"mal ladke",loc:"Mau, UP",phone:"8881468521",email:"ay7138609@gmail.com"};
const CATS=["Groceries","Dairy","Snacks","Beverages","Cloth"];
// For photos use DIRECT image links (e.g. https://i.ibb.co/xxxx/name.jpg), not the ibb.co page link.
const PRODUCTS=[
 {id:1,name:"Loki",price:500,cat:"Cloth",emoji:"👕",img:"https://ibb.co/wr2CzLZj"},
 {id:2,name:"Santara",price:600,cat:"Cloth",emoji:"👗",img:"https://ibb.co/Cp3yF3n7"}
];
/* ================================================ */
let cart={};
try{cart=JSON.parse(localStorage.getItem("cart")||"{}")}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem("cart",JSON.stringify(cart))}catch(e){}};
$("tag").textContent=SHOP.tagline+" · "+SHOP.loc;
$("tel").textContent=SHOP.phone;$("tel").href="tel:"+SHOP.phone;
$("mail").textContent=SHOP.email;$("mail").href="mailto:"+SHOP.email;
$("cat").innerHTML='<option value="">All categories</option>'+CATS.map(c=>`<option>${c}</option>`).join("");

function render(){
  const q=$("q").value.toLowerCase(),c=$("cat").value;
  const list=PRODUCTS.filter(p=>(!c||p.cat===c)&&p.name.toLowerCase().includes(q));
  $("grid").innerHTML=list.length?list.map(p=>`<div class="card">
    <div class="img"><img src="${p.img}" alt="${p.name}" onerror="this.replaceWith(document.createTextNode('${p.emoji||"📦"}'))"></div>
    <div class="info"><b>${p.name}</b><small>${p.cat}</small><span class="price">₹${p.price}</span>
    <button onclick="add(${p.id})">Add to cart</button></div></div>`).join(""):'<div class="empty">No products found.</div>';
  upd();
}
function add(id){cart[id]=(cart[id]||0)+1;save();upd()}
function chg(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();upd()}
function lines(){return Object.keys(cart).map(id=>{const p=PRODUCTS.find(x=>x.id==id);return p?{p,n:cart[id]}:null}).filter(Boolean)}
function upd(){
  const L=lines();let t=0,n=0;
  $("items").innerHTML=L.length?L.map(({p,n:k})=>{t+=p.price*k;n+=k;
    return `<div class="row"><div>${p.name}<br><small>₹${p.price} × ${k}</small></div>
    <div class="qty"><button class="alt" onclick="chg(${p.id},-1)">−</button> ${k} <button class="alt" onclick="chg(${p.id},1)">+</button></div></div>`}).join(""):'<div class="empty">Cart is empty.</div>';
  $("tot").textContent="₹"+t;$("cnt").textContent=n;
}
function openCart(o){$("panel").classList.toggle("open",o)}
function send(how){
  const L=lines();
  if(!L.length)return alert("Your cart is empty.");
  const nm=$("nm").value.trim(),ph=$("ph").value.trim(),ad=$("ad").value.trim();
  if(!nm||!ph||!ad)return alert("Please fill name, phone and address.");
  const total=L.reduce((s,{p,n})=>s+p.price*n,0);
  const msg=`New order – ${SHOP.name}\n\n`+L.map(({p,n})=>`• ${p.name} × ${n} = ₹${p.price*n}`).join("\n")+
    `\n\nTotal: ₹${total}\nName: ${nm}\nPhone: ${ph}\nAddress: ${ad}`;
  if(how==="wa")window.open("https://wa.me/91"+SHOP.phone+"?text="+encodeURIComponent(msg),"_blank");
  else location.href="mailto:"+SHOP.email+"?subject="+encodeURIComponent("New order from "+nm)+"&body="+encodeURIComponent(msg);
}
render();
</script>
</body>
</html>
